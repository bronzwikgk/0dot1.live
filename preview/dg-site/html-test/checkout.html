<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f5f5f5;
      }
      .container {
        margin-top: 20px;
      }
      .checkout-header {
        background-color: #232f3e;
        padding: 15px;
        color: white;
        text-align: center;
        font-size: 24px;
        border-radius: 8px;
      }
      .card {
        margin-bottom: 20px;
      }
      .order-summary {
        background-color: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
      }
      .btn-primary {
        background-color: #ff9900;
        border-color: #ff9900;
      }
      .btn-primary:hover {
        background-color: #e68a00;
        border-color: #e68a00;
      }
      .card-header {
        background-color: #f0f0f0;
      }
      .product-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .product-item img {
        width: 60px;
        height: auto;
      }
      #go-back-to-cart {
        margin-bottom: 2rem;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Checkout Header -->
      <div class="checkout-header">
        <h2>Checkout</h2>
      </div>

      <div class="row mt-4">
        <!-- Left Side - Customer Information -->
        <div class="col-lg-8 col-md-7 col-sm-12 mb-4">
          <div class="card">
            <div class="card-header">
              <h5>1. Billing Information</h5>
            </div>
            <div class="card-body">
              <form id="billing-form">
                <div class="row">
                  <div class="col-md-6">
                    <label for="billingFullName" class="form-label"
                      >Full Name</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="billingFullName"
                      placeholder="John Doe"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="billingPhone" class="form-label"
                      >Phone Number</label
                    >
                    <input
                      type="tel"
                      class="form-control"
                      id="billingPhone"
                      placeholder="+91 9876543210"
                      required
                    />
                  </div>
                </div>
                <div class="row mt-3">
                  <div class="col-md-4">
                    <label for="billingEmail" class="form-label">Email</label>
                    <input
                      type="email"
                      class="form-control"
                      id="billingEmail"
                      placeholder="you@example.com"
                      required
                    />
                  </div>
                  <div class="col-md-4">
                    <label for="billingZip" class="form-label">Zip Code</label>
                    <input
                      type="text"
                      class="form-control"
                      id="billingZip"
                      required
                    />
                  </div>
                  <div class="col-md-4">
                    <label for="billingState" class="form-label"
                      >City,State</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="billingState"
                      required
                    />
                  </div>
                </div>
              </form>
            </div>
          </div>
          <!-- Shipping Information Card -->
          <div class="card" id="shipping-info-card">
            <div class="card-header">
              <h5>1. Shipping Information</h5>
            </div>
            <div class="card-body">
              <form id="shipping-form">
                <div class="row">
                  <div class="col-md-6">
                    <label for="billingFullName" class="form-label"
                      >Full Name</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="billingFullName"
                      placeholder="John Doe"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="billingPhone" class="form-label"
                      >Phone Number</label
                    >
                    <input
                      type="tel"
                      class="form-control"
                      id="billingPhone"
                      placeholder="+91 9876543210"
                      required
                    />
                  </div>
                </div>

                <div class="row mt-3">
                  <div class="col-md-6">
                    <label for="shippingAddress" class="form-label"
                      >Address</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="shippingAddress"
                      placeholder="1234 Main St"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="shippingCity" class="form-label">City</label>
                    <input
                      type="text"
                      class="form-control"
                      id="shippingCity"
                      required
                    />
                  </div>
                </div>
                <div class="row mt-3">
                  <div class="col-md-6">
                    <label for="shippingState" class="form-label">State</label>
                    <input
                      type="text"
                      class="form-control"
                      id="shippingState"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="shippingZip" class="form-label">Zip Code</label>
                    <input
                      type="text"
                      class="form-control"
                      id="shippingZip"
                      required
                    />
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- Right Side - Order Summary -->
        <div class="col-lg-4 col-md-5 col-sm-12">
          <div class="card">
            <div class="card-header">
              <h5>2. Order Summary</h5>
            </div>
            <div class="card-body order-summary">
              <div id="product-list"></div>
              <hr />
              <!-- Promo Code Section -->
              <div class="promo-code-section mb-3">
                <div class="d-flex justify-content-between align-items-center">
                  <input
                    type="text"
                    id="promo-code"
                    class="form-control me-2"
                    placeholder="Enter promo code here"
                  />
                  <button id="apply-promo" class="btn btn-primary">
                    Apply
                  </button>
                </div>
              </div>
              <hr />
              <h5>Billing Details</h5>
              <div class="d-flex justify-content-between">
                <p class="mb-0"><small>Total Price</small></p>
                <p id="total-price" class="mb-0"><strong></strong></p>
              </div>
              <div id="gst-box" class="d-flex justify-content-between"></div>
              <hr />
              <div class="d-flex justify-content-between">
                <h5><strong>Grand Total</strong></h5>
                <h5 id="grand-total"><strong></strong></h5>
              </div>
            </div>
          </div>

          <div class="d-grid gap-2 mt-3">
            <button id="place-order" class="btn btn-primary btn-lg">
              Place Your Order
            </button>
          </div>
        </div>
      </div>
      <div class="row mt-4">
        <div class="col-12 text-start">
          <a href="./cart.html" id="go-back-to-cart" class="btn btn-secondary"
            >Go Back to Cart</a
          >
        </div>
      </div>
    </div>

    <!-- Handlebars Template for Cart Items -->
    <script id="cart-items-template" type="text/x-handlebars-template">
      {{#each cartItems}}
        <div class="product-item d-flex align-items-center mb-3">
          <!-- Display product image from productDetails -->
          <img
            src="{{this.productDetails.image}}"
            alt="{{this.productDetails.title}}"
            class="img-thumbnail me-3"
            style="width: 50px; height: 50px;"
          />

          <div class="w-100">
            <!-- Display product title from productDetails -->
            <p class="mb-0"><strong>{{this.productDetails.title}}</strong>
              -
              {{this.optionTitle}}</p>
            <p class="text-muted mb-1">Qty:
              <strong>{{this.quantity}}</strong></p>

            <!-- Display the price from region_price -->
            <p class="text-muted mb-0"><strong> {{this.price}} </strong>
              each</p>
          </div>

        </div>
      {{/each}}
    </script>
    <!-- <div class="text-end">
           
            <p class="mb-0">₹{{this.totalPrice}}</p>
          </div> -->

    <!-- Add this script tag before your custom script files -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Handlebars.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.7/handlebars.min.js"></script>
    <script type="module" src="../js/pages/checkOut.js"></script>
  </body>
</html>
