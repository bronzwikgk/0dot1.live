                          id="email"

                          type="password"
                          class="form-control"
                          name="password"
                          id="password"

                      <div class="col-12">
                        <div class="form-check">

    <script>
      // This function updates the country code based on the selected country
      function updateCountryCode() {
        const selectedCountry = document.getElementById("regCountry");
        const countryCode =
          selectedCountry.options[selectedCountry.selectedIndex]?.getAttribute(
            "data-code",
          );
        document.getElementById("countryCode").innerText = countryCode || "+1"; // Fallback to a default code
      }
      function showLoginForm() {
        document.getElementById("login-form-container").style.display = "block";
        document.getElementById("signup-form-container").style.display = "none";
        resetForms();
      }

      function showSignupForm() {
        document.getElementById("login-form-container").style.display = "none";
        document.getElementById("signup-form-container").style.display =
          "block";
        resetForms();
      }
      function resetForms() {
        document.getElementById("login-form").reset();
        document.getElementById("register-form").reset();
      }

      // Initially show the login form
      document.addEventListener("DOMContentLoaded", showLoginForm);
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"

    ></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Function to get a cookie value by name
        function getCookie(name) {
          const value = `; ${document.cookie}`;
          const parts = value.split(`; ${name}=`);
          if (parts.length === 2) return parts.pop().split(";").shift();
          return null;
        }

        // Check if the token cookie exists
        const token = getCookie("token");

        if (token) {
          // Redirect to shop.html if the token exists
          window.location.href = "shop.html";
        }
      });
    </script>
