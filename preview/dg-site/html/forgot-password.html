<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="../beauty/bootstrap/bootstrap-dg-site-theme.css">
    <style>
        body, html {
            height: 100%;
        }
        a {
            text-decoration: none;
        }
        .card {
            border-radius: 0;
        }
        .form-container {
            display: none;
        }
    </style>
</head>
<body>
<section>
    <div class="container-fluid" style="padding: 0">
        <div class="card border-light-subtle shadow-sm">
            <div class="row g-0" style="min-height: 100vh">
                <div class="col-12 col-md-6 text-bg-primary">
                    <div class="d-flex align-items-center justify-content-center h-100">
                        <div class="col-10 col-xl-8 py-3 text-left">
                            <img class="img-fluid rounded mb-4" src="../assets/assets_dg-site/logo/dg logo/ducis group logo v 0-0-2 trans dark.webp"
                                 width="245" height="80" alt="BootstrapBrain Logo"/>
                            <hr class="border-primary-subtle mb-4"/>
                            <h2 class="h1 mb-4">Reset your password to regain access</h2>
                            <p class="lead m-0">Follow the steps to securely reset your password</p>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <div class="card-body p-3 p-md-4 p-xl-5">
                        <div class="form-container" id="forgot-password-form-container" style="display: block;">
                            <form id="forgot-password-form">
                                <div class="row">
                                    <div class="col-12">
                                        <div class="mb-5">
                                            <h3>Reset Password</h3>
                                        </div>
                                    </div>
                                </div>
                                <div class="row gy-3 gy-md-4">
                                    <div class="col-12">
                                        <label for="forgotEmail" class="form-label">Email <span class="text-danger">*</span></label>
                                        <input type="email" class="form-control" name="forgotEmail" id="forgotEmail" placeholder="email@example.com" required/>
                                    </div>
                                    <div class="col-12">
                                        <div class="d-grid">
                                            <button class="btn bsb-btn-xl btn-primary" type="button" onclick="sendOTP()">Send OTP</button>
                                        </div>
                                    </div>
                                    <div class="col-12" style="display: none;" id="otpSection">
                                        <label for="otp" class="form-label">OTP <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" name="otp" id="otp" placeholder="Enter your OTP" required/>
                                        <div class="d-grid mt-3">
                                            <button class="btn bsb-btn-xl btn-secondary" type="button" onclick="validateOTP()">Verify OTP</button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                            <!-- Password reset form is separated out -->
                            <form id="reset-password-form" style="display: none;">
                                <div class="row gy-3 gy-md-4">
                                    <div class="col-12">
                                        <label for="newPassword" class="form-label">New Password <span class="text-danger">*</span></label>
                                        <input type="password" class="form-control" name="newPassword" id="newPassword" placeholder="New Password" required/>
                                    </div>
                                    <div class="col-12">
                                        <label for="confirmNewPassword" the form-label">Confirm New Password <span class="text-danger">*</span></label>
                                        <input type="password" class="form-control" name="confirmNewPassword" id="confirmNewPassword" placeholder="Confirm New Password" required/>
                                    </div>
                                    <div class="col-12">
                                        <div class="d-grid">
                                            <button class="btn bsb-btn-xl btn-primary" type="submit">Reset Password</button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<script>
    function sendOTP() {
        var email = document.getElementById('forgotEmail').value;
        console.log("Sending OTP to:", email);  // Debug log
        fetch('https://unbelong.in/api/auth/forgot-password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email: email })
        })
        .then(response => response.json())
        .then(data => {
            console.log("OTP Send Response:", data);  // Debug log
            showMessage('OTP Send Response', 'lightgreen');
            document.getElementById('otpSection').style.display = 'block';
        })
        .catch((error) => {
            console.error('Error:', error);
            showMessage('Failed to send OTP. Please try again.', 'tomato');
            
        });
    }

    function validateOTP() {
        var email = document.getElementById('forgotEmail').value;
        var otp = document.getElementById('otp').value;
        console.log("Validating OTP:", otp, "for email:", email);  // Debug log
        fetch('https://unbelong.in/api/auth/verify-otp', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email: email, otp: otp })
        })
        .then(response => response.json())
        .then(data => {
            console.log("OTP Validation Response:", data);  // Debug log
            if (data.message === "OTP verified") {
                showMessage('OTP verified successfully.', 'lightgreen');
                document.getElementById('reset-password-form').style.display = 'block';
            } else {
                showMessage(data.message, 'tomato');
            }
        })
        .catch((error) => {
            console.error('Error:', error);
            showMessage('Failed to verify OTP. Please try again.', 'tomato');
        });
    }

    document.getElementById('reset-password-form').addEventListener('submit', function(event) {
        event.preventDefault();
        var email = document.getElementById('forgotEmail').value;
        var otp = document.getElementById('otp').value;
        var newPassword = document.getElementById('newPassword').value;
        var confirmNewPassword = document.getElementById('confirmNewPassword').value;

        console.log("Resetting password for:", email);  // Debug log

        if (newPassword !== confirmNewPassword) {
            showMessage('Passwords do not match.', 'tomato');
            return;
        }

        fetch('https://unbelong.in/api/auth/reset-password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                email: email,
                otp: otp,
                newPassword: newPassword
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Failed to reset password');
            }
            return response.json();
        })
        .then(data => {
            console.log("Password Reset Response:", data);  // Debug log
            showMessage(data.message, 'lightgreen');
            window.location.href = '/html/auth.html';
        })
        .catch((error) => {
            console.error('Error:', error);
            showMessage(error.message, 'tomato');
        });
    });

    // Function to create and display messages dynamically
function showMessage(message, color) {
    const messageDiv = document.createElement('div');
    messageDiv.textContent = message;
    messageDiv.style.position = 'fixed';
    messageDiv.style.top = '20%';
    messageDiv.style.left = '50%';
    messageDiv.style.transform = 'translateX(-50%)';
    messageDiv.style.backgroundColor = color;
    messageDiv.style.color = 'white';
    messageDiv.style.padding = '15px 30px';
    messageDiv.style.borderRadius = '5px';
    messageDiv.style.zIndex = '1000';
    document.body.appendChild(messageDiv);
  
    setTimeout(() => {
      document.body.removeChild(messageDiv);
    }, 2000);
  }

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
