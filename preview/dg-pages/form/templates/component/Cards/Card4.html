<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-7">
  {{#each projects}}
  <a class="bg-lightwhite dark:bg-white/5 rounded-2xl p-6" href="/projects-details">
    <div class="flex gap-4 mb-4">
      <div class="flex-1">
        <p class="mb-1 text-sm font-semibold">{{title}}</p>
        <p class="text-xs text-black/40 dark:text-white/40">Due Date: {{dueDate}}</p>
      </div>
      <img class="w-[42px] h-[42px] flex-none rounded-full overflow-hidden object-cover" src="{{avatarSrc}}" alt="">
    </div>
    <div class="flex items-center justify-between gap-2 text-xs mb-3">
      <img class="w-6 h-6 flex-none rounded-full overflow-hidden object-cover" src="{{avatarSrc}}" alt="">
      <div class="flex items-center text-xs text-{{#if (eq progress.status "In Progress")}}[#8A8CD9]{{else if (eq progress.status "Completed")}}[#4AA785]{{else}}black/40{{/if}}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 8C11 9.65685 9.65685 11 8 11C6.34315 11 5 9.65685 5 8C5 6.34315 6.34315 5 8 5C9.65685 5 11 6.34315 11 8Z" fill="currentcolor"></path>
        </svg>
        <p>{{progress.status}}</p>
      </div>
    </div>
    <div class="mt-1 mb-2 h-1 relative w-full rounded-full overflow-hidden">
      <div class="w-full h-full bg-lightblue-300/20 dark:bg-white/5 absolute"></div>
      <div class="h-full bg-{{#if (eq progress.status "In Progress")}}[#8A8CD9]{{else if (eq progress.status "Completed")}}lightgreen-200{{else}}black/40{{/if}} absolute" style="width: {{progress.percentage}}%;"></div>
    </div>
    <div class="flex items-center gap-4 justify-between text-xs">
      <p>{{tasks.completed}} <span class="text-black/40 dark:text-white/40">/</span> {{tasks.total}} <span class="text-black/40 dark:text-white/40">Total Tasks</span></p>
      <p>{{progress.percentage}}%</p>
    </div>
  </a>
  {{/each}}
</div>
