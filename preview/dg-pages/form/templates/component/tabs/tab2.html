<div x-data="{activeunderTab='profile'}">
    <ul class="flex flex-wrap -mb-px text-sm text-center text-black/50 dark:text-white/50 border-b border-gray-200">
        {{#each tabs}}
        <li class="mr-2">
            <a href="javaScript:;" @click="activeunderTab = '{{name}}'" :class="activeunderTab === '{{name}}' ? 'text-black border-b-2 border-black dark:text-white dark:border-white' : 'text-black/40 dark:text-white/40 border-b-2 border-transparent rounded-t-lg hover:text-black dark:hover:text-white hover:border-black dark:hover:border-white'" class="inline-block p-4 text-black/40 dark:text-white/40 border-b-2 border-transparent rounded-t-lg hover:text-black dark:hover:text-white hover:border-black dark:hover:border-white">
                {{title}}
            </a>
        </li>
        {{/each}}
        <li>
            <a class="inline-block p-4 text-gray-400 rounded-t-lg cursor-not-allowed">Disabled</a>
        </li>
    </ul>
    <div class="tab-content mt-3 text-[13px]">
        {{#each tabs}}
        <div x-show="activeunderTab === '{{name}}'" class="">
            <p>
                {{content}}
            </p>
        </div>
        {{/each}}
    </div>
</div>
