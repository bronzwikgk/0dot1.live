<!-- Start Content -->
<div class="h-[calc(100vh-73px)] overflow-y-auto overflow-x-hidden">
    <div class="p-4 sm:p-7 min-h-[calc(100vh-145px)]">
        {{#each checkboxSections}}
        <div class="px-2 py-1 mb-4">
            <h2 class="text-lg font-semibold">{{this.title}}</h2>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-7">
            <div class="border border-black/10 dark:border-white/10 p-5 rounded-md">
                <div class="mb-5">
                    <p class="text-sm font-semibold">{{this.title}}</p>
                </div>
                <div class="grid grid-cols-1 gap-3">
                    {{#each this.options}}
                    <label class="inline-flex">
                        <input type="checkbox" class="form-checkbox {{this.color}}" checked="">
                        <span>{{this.label}}</span>
                    </label>
                    {{/each}}
                </div>
            </div>
        </div>
        {{/each}}
    </div>
    <!-- Start Footer -->
    <footer class="p-7 bg-white dark:bg-black flex flex-wrap items-center justify-center sm:justify-between gap-3">
        <p class="text-xs text-black/40 dark:text-white/40">{{footerText}}</p>
        <ul class="flex items-center text-black/40 dark:text-white/40 text-xs">
            {{#each footerLinks}}
            <li><a href="javascirpt:;" class="px-2 py-1 hover:text-black dark:hover:text-white transition-all duration-300">{{this.text}}</a></li>
            {{/each}}
        </ul>
    </footer>
    <!-- End Footer -->
</div>
<!-- End Content -->
