<!-- Start Content -->
<div class="h-[calc(100vh-73px)] overflow-y-auto overflow-x-hidden">
    <div class="p-4 sm:p-7 min-h-[calc(100vh-145px)]">
        <div class="px-2 py-1 mb-4">
            <h2 class="text-lg font-semibold">{{switchesTitle}}</h2>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-7">
            {{#each switches}}
            <div class="border border-black/10 dark:border-white/10 p-5 rounded-md">
                <div class="mb-5">
                    <p class="text-sm font-semibold">{{label}}</p>
                </div>
                <div class="togglebutton inline-block">
                    <label for="{{id}}" class="flex items-center cursor-pointer">
                        <div class="relative">
                            <input type="checkbox" id="{{id}}" class="sr-only">
                            {{!-- Custom styling based on theme --}}
                            {{#if (eq label "Solid Rounded")}}
                            <div class="block band bg-black/20 dark:bg-white/20 w-[52px] h-7 rounded-full"></div>
                            <div class="dot absolute left-[1.5px] top-[2px] bg-white dark:bg-black w-6 h-6 rounded-full transition"></div>
                            {{else}}
                            <div class="block band bg-black/20 dark:bg-white/20 w-[52px] h-7"></div>
                            <div class="dot absolute left-[1.5px] top-[2px] bg-white dark:bg-black w-6 h-6 transition"></div>
                            {{/if}}
                        </div>
                    </label>
                </div>
            </div>
            {{/each}}
        </div>
    </div>
    <!-- Start Footer -->
    <footer class="p-7 bg-white dark:bg-black flex flex-wrap items-center justify-center sm:justify-between gap-3">
        <p class="text-xs text-black/40 dark:text-white/40">{{footerText}}</p>
        <ul class="flex items-center text-black/40 dark:text-white/40 text-xs">
            {{#each footerLinks}}
            <li><a href="{{url}}" class="px-2 py-1 hover:text-black dark:hover:text-white transition-all duration-300">{{text}}</a></li>
            {{/each}}
        </ul>
    </footer>
    <!-- End Footer -->
</div>
<!-- End Content -->
