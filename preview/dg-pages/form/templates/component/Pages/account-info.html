<!-- Start Content -->
<div class="min-h-[calc(100vh-134px)] py-4 px-4 sm:px-12 flex justify-center items-center">
    <div class="max-w-[680px] flex-none w-full bg-white dark:bg-white/5 p-4 sm:p-10 lg:px-[146px] lg:py-12 rounded-2xl loginform">
        <h1 class="text-2xl font-semibold mb-2 text-center">Account Info</h1>
        <p class="text-center text-black/40 dark:text-white/40 mb-7">If you need more info, please check out <a href="javaScript:;" class="text-lightpurple-300">Help Page</a>.</p>
        <form class="">
            <h3 class="font-semibold mb-3">Specify Team Size</h3>
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-2">
                {{#each teamSizes}}
                <div class="relative budget-input">
                    <label class="flex cursor-pointer rounded-lg border border-black/10 dark:border-white/10 bg-white dark:bg-white/5 justify-between items-start gap-4 py-2.5 px-2 text-center">
                        <h3 class="font-semibold relative z-10 mx-auto">{{this.label}}</h3>
                        <input name="teamsize" type="radio" class="form-checkbox relative hidden z-10 peer">
                        <span class="rounded-lg border border-black/10 dark:border-white/10 peer-checked:border-black dark:peer-checked:border-lightpurple-200 peer-checked:bg-lightwhite dark:peer-checked:bg-white/5 absolute top-0 left-0 z-0 w-full h-full"></span>
                    </label>
                </div>
                {{/each}}
            </div>
            <p class="text-black/40 dark:text-white/40 mb-7">Customers will see this shortened version of your statement descriptor.</p>
            <div class="mb-7">
                <label class="font-semibold">Team Account Name</label>
                <input type="text" value="" placeholder="" class="form-input mt-3">
            </div>
            <h3 class="font-semibold mb-3">Select Account Plan</h3>
            <div class="grid grid-cols-1 gap-4 mb-7">
                {{#each accountPlans}}
                <div class="relative budget-input">
                    <label class="flex cursor-pointer rounded-lg bg-lightwhite dark:bg-white/5 px-4 py-3.5">
                        <div class="relative z-10 flex items-start gap-3">
                            <!-- Icon SVG -->
                            <div>
                                <h3 class="mb-1 font-semibold">{{this.title}}</h3>
                                <p class="text-black/40 dark:text-white/40">{{this.description}}</p>
                            </div>
                        </div>
                        <input name="accountplan" type="radio" class="form-checkbox relative hidden z-10 peer">
                        <span class="rounded-lg border-2 border-transparent peer-checked:border-black dark:peer-checked:border-lightpurple-200 peer-checked:bg-lightwhite dark:peer-checked:bg-white/5 absolute top-0 left-0 z-0 w-full h-full"></span>
                    </label>
                </div>
                {{/each}}
            </div>
            <div class="text-center grid grid-cols-1 sm:grid-cols-2 gap-4">
                <button type="button" class="py-2 inline-flex gap-2 justify-center items-center px-10 bg-black/5 dark:bg-white/5 rounded-lg text-black dark:text-white text-lg font-semibold border border-black/5 dark:border-white/5 hover:bg-black hover:text-white dark:hover:text-black dark:hover:bg-lightpurple-200 hover:border-black dark:hover:border-lightpurple-200 transition-all duration-300">
                    <!-- Icon SVG -->
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M12.9254 4.55806C13.1915 4.80214 13.1915 5.19786 12.9254 5.44194L8.4375 9.55806C8.17138 9.80214 8.17138 10.1979 8.4375 10.4419L12.9254 14.5581C13.1915 14.8021 13.1915 15.1979 12.9254 15.4419C12.6593 15.686 12.2278 15.686 11.9617 15.4419L7.47378 11.3258C6.67541 10.5936 6.67541 9.40641 7.47378 8.67418L11.9617 4.55806C12.2278 4.31398 12.6593 4.31398 12.9254 4.55806Z" fill="currentcolor"></path>
                    </svg>
                    <p class="inline-block">Previous</p>
                </button>
                <button type="button" class="py-2 inline-flex gap-2 justify-center items-center px-10 bg-black/5 dark:bg-white/5 rounded-lg text-black dark:text-white text-lg font-semibold border border-black/5 dark:border-white/5 hover:bg-black hover:text-white dark:hover:text-black dark:hover:bg-lightpurple-200 hover:border-black dark:hover:border-lightpurple-200  transition-all duration-300">
                    <p class="inline-block">Submit</p>
                    <svg class="flex-none" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M7.07459 15.4419C6.80847 15.1979 6.80847 14.8021 7.07459 14.5581L11.5625 10.4419C11.8286 10.1979 11.8286 9.80214 11.5625 9.55806L7.07459 5.44194C6.80847 5.19786 6.80847 4.80214 7.07459 4.55806C7.34072 4.31398 7.77219 4.31398 8.03831 4.55806L12.5262 8.67418C13.3246 9.40641 13.3246 10.5936 12.5262 11.3258L8.03831 15.4419C7.77219 15.686 7.34072 15.686 7.07459 15.4419Z" fill="currentcolor"></path>
                    </svg>
                </button>
            </div>
        </form>
    </div>
</div>
<!-- End Content -->
