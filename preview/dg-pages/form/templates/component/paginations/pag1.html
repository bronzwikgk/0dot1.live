<div class="flex flex-col items-center justify-center gap-3">
    <ul class="inline-flex items-center gap-1 m-auto mb-4">
        {{#each buttons}}
            <li><button type="button" class="flex justify-center px-3.5 py-2 rounded transition {{class}}">{{label}}</button></li>
        {{/each}}
    </ul>

    <ul class="inline-flex -space-x-px list-inside my-2">
        {{#each links}}
            <li><a href="#" class="py-2 px-3 {{class}}">{{label}}</a></li>
        {{/each}}
    </ul>
</div>
