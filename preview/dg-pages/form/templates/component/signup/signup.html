<!-- Start Content -->
<div class="min-h-[calc(100vh-134px)] py-4 px-4 sm:px-12 flex justify-center items-center">
    <div class="max-w-[680px] flex-none w-full bg-white dark:bg-white/5 p-4 sm:p-10 lg:px-[146px] lg:py-12 rounded-2xl loginform">
        <h1 class="text-2xl font-semibold mb-2 text-center">Sign Up</h1>
        <p class="text-center text-black/40 dark:text-white/40 mb-7">Your Social Campaigns</p>
        <div class="flex flex-wrap items-center gap-4 mb-7">
            <a href="javaScript:;" class="flex flex-1 items-center gap-1 py-1 pl-2 pr-3 border border-black/10 dark:border-white/10 hover:border-black dark:hover:border-white rounded-lg transition-all duration-300">
                <div class="w-8 h-8 flex-none bg-white rounded-full p-2">
                    <img src="../images/google.svg">
                </div>
                <p class="whitespace-nowrap">Sign in with Google</p>
            </a>
            <a href="javaScript:;" class="flex flex-1 items-center gap-1 py-1 pl-2 pr-3 border border-black/10 dark:border-white/10 hover:border-black dark:hover:border-white rounded-lg transition-all duration-300">
                <div class="w-8 h-8 flex-none bg-white rounded-full p-2">
                    <img src="../images/apple-icon.svg">
                </div>
                <p class="whitespace-nowrap">Sign in with Apple</p>
            </a>
        </div>
        <div class="flex items-center mb-7">
            <div class="w-full h-[2px] bg-black/10 dark:bg-white/10"></div>
            <div class="text-black/40 dark:text-white/40 px-5 whitespace-nowrap">Or with Email</div>
            <div class="w-full h-[2px] bg-black/10 dark:bg-white/10"></div>
        </div>
        <form class="mb-4">
            <div class="mb-4">
                <input type="text" value="" placeholder="Email" class="form-input">
            </div>
            <div class="mb-2 relative">
                <input type="password" value="" placeholder="Password" class="form-input !pr-7">
                <button type="button" class="absolute top-3 right-3 text-black/20 hover:text-black dark:text-white/20 dark:hover:text-white">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- SVG Path for Password Icon -->
                    </svg>
                </button>
            </div>
            <div class="flex gap-2 mb-3">
                {{#each passwordHints}}
                    <div class="h-1 bg-black/10 dark:bg-white/10 w-full"></div>
                {{/each}}
            </div>
            <p class="text-xs text-black/40 dark:text-white/40 mb-4">Use 8 or more characters with a mix of letters, numbers & symbols.</p>
            <div class="mb-4">
                <input type="password" value="" placeholder="Repeat Password" class="form-input">
            </div>
            <div class="flex items-center mb-7 p-1.5 gap-3">
                <input id="teams" type="checkbox" class="w-[18px] h-[18px] text-black bg-white dark:bg-white/5 border-black/20 dark:border-white/20 rounded focus:ring-0 focus:outline-0 focus:outline-offset-0 focus:ring-offset-0">
                <label for="teams" class="text-black/40 dark:text-white/40">I Accept the Terms</label>
            </div>
            <button type="button" class="py-2 px-4 bg-black dark:bg-lightpurple-200 w-full rounded-lg text-white dark:text-black text-lg font-semibold border border-black dark:border-lightpurple-200 hover:bg-transparent dark:hover:bg-transparent hover:text-black dark:hover:text-white transition-all duration-300">
                Sign Up
            </button>
        </form>
        <p class="text-center text-black/40 dark:text-white/40">Already have an Account? <a class="text-lightpurple-300" href="/login">Sign in</a></p>
    </div>
</div>
<!-- End Content -->
