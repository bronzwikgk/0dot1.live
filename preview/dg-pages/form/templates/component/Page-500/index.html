<div class="text-center sm:flex-none">
    <h2 class="text-5xl font-semibold mb-2">{{pageTitle}}</h2>
    <p class="text-black/40 dark:text-white/40 mb-10">{{errorMessage}}</p>
    <img src="{{imageLight}}" class="mb-11 mx-auto dark:hidden" alt="images">
    <img src="{{imageDark}}" class="mb-11 mx-auto hidden dark:block" alt="images">

    <a class="max-w-[149px] py-1 px-2 inline-block bg-black/5 dark:bg-white/5 w-full rounded-lg text-black/40 dark:text-white/40 border border-black/5 dark:border-white/5 hover:bg-transparent dark:hover:bg-transparent hover:text-black dark:hover:text-white transition-all duration-300" href="{{buttonLink}}">
        {{buttonText}}
    </a>
</div>
