<!-- Start Content -->
<div class="h-[calc(100vh-73px)] overflow-y-auto overflow-x-hidden">
    <div class="p-4 sm:p-7 min-h-[calc(100vh-145px)]">
        <div class="px-2 py-1 mb-4">
            <h2 class="text-lg font-semibold">Timeline</h2>
        </div>
        <div class="grid grid-cols-1 xl:grid-cols-2 gap-7">
            {{#each timelineItems}}
            <div class="border col-span-2 border-black/10 dark:border-white/5 p-5 !pb-14 rounded-md">
                <div class="mb-5">
                    <p class="text-sm font-semibold">{{title}}</p>
                </div>

                <div class="relative">
                    {{#if showDivider}}
                    <div class="hidden md:block border-light dark:border-white/10 border-l absolute h-full left-1/2 transform -translate-x-1/2"></div>
                    {{/if}}
                    <div class="relative">
                        <div class="flex flex-col md:flex-row items-center">
                            <div class="flex justify-end w-full mx-auto items-center">
                                <div class="w-full md:w-1/2 md:block hidden">
                                    <img src="{{imageSrc}}" class="mx-auto" alt="">
                                </div>
                                <div class="w-full md:w-1/2 md:pl-8 lg:pl-[110px]">
                                    <div class="bg-lightblue-100 dark:bg-white/5 p-8 rounded-2xl relative">
                                        <div class="md:hidden block">
                                            <img src="{{imageSrc}}" class="h-16" alt="">
                                        </div>
                                        <h5 class="font-semibold text-[22px] leading-[33px] mt-7 md:mt-0">{{heading}}</h5>
                                        <p class="text-[15px] leading-7 text-dark-light mt-4">{{description}}</p>
                                    </div>
                                </div>
                            </div>
                            {{#if showIndicator}}
                            <div class="absolute left-1/2 -translate-y-1/2 -translate-x-1/2 top-1/2 md:block hidden">
                                <div class="bg-lightblue-300 w-4 h-4 rounded-full"></div>
                                <span class="h-px w-[93px] absolute inline-block bg-lightblue-300 dark:bg-white/10 -z-20 top-1/2 -translate-y-1/2"></span>
                            </div>
                            {{/if}}
                        </div>
                    </div>
                </div>
            </div>
            {{/each}}
        </div>
    </div>
    <!-- Start Footer -->
    <footer class="p-7 bg-white dark:bg-black flex flex-wrap items-center justify-center sm:justify-between gap-3">
        <p class="text-xs text-black/40 dark:text-white/40">© {{year}} {{company}}</p>
        <ul class="flex items-center text-black/40 dark:text-white/40 text-xs">
            <li><a href="{{aboutLink}}" class="px-2 py-1 hover:text-black dark:hover:text-white transition-all duration-300">About</a></li>
            <li><a href="{{supportLink}}" class="px-2 py-1 hover:text-black dark:hover:text-white transition-all duration-300">Support</a></li>
            <li><a href="{{contactLink}}" class="px-2 py-1 hover:text-black dark:hover:text-white transition-all duration-300">Contact Us</a></li>
        </ul>
    </footer>
    <!-- End Footer -->
</div>
<!-- End Content -->
