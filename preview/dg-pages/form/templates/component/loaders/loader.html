<!-- Start Content -->
<div class="h-[calc(100vh-73px)] overflow-y-auto overflow-x-hidden">
    <div class="p-4 sm:p-7 min-h-[calc(100vh-145px)]">
        <div class="px-2 py-1 mb-4">
            <h2 class="text-lg font-semibold">Loader</h2>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-7">
            {{#each loaderTypes}}
            <div class="border border-black/10 dark:border-white/10 p-5 rounded-md">
                <div class="mb-5">
                    <p class="text-sm font-semibold">{{type}}</p>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    {{!-- Spinner animations --}}
                </div>
            </div>
            {{/each}}
            <div class="border border-black/10 dark:border-white/10 p-5 rounded-md">
                <div class="mb-5">
                    <p class="text-sm font-semibold">Button Loader</p>
                </div>
                <div class="flex flex-wrap items-center gap-4">
                    <button type="button" class="btn bg-black/10">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" class="inline-block h-5 w-5 animate-[spin_2s_linear_infinite] align-middle mr-2">
                            {{!-- SVG lines for loading animation --}}
                        </svg>
                        {{buttonText}}
                    </button>
                    {{!-- Other button loaders --}}
                </div>
            </div>
        </div>
    </div>
    <!-- Start Footer -->
    <footer class="p-7 bg-white dark:bg-black flex flex-wrap items-center justify-center sm:justify-between gap-3">
        <p class="text-xs text-black/40 dark:text-white/40">© 2025 shunya.ek</p>
        <ul class="flex items-center text-black/40 dark:text-white/40 text-xs">
            <li><a href="javascirpt:;" class="px-2 py-1 hover:text-black dark:hover:text-white transition-all duration-300">About</a></li>
            <li><a href="javascirpt:;" class="px-2 py-1 hover:text-black dark:hover:text-white transition-all duration-300">Support</a></li>
            <li><a href="javascirpt:;" class="px-2 py-1 hover:text-black dark:hover:text-white transition-all duration-300">Contact Us</a></li>
        </ul>
    </footer>
    <!-- End Footer -->
</div>
<!-- End Content -->
