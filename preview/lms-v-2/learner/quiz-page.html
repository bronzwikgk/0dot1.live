    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js"
        integrity="sha512-E1dSFxg+wsfJ4HKjutk/WaCzK7S2wv1POn1RRPGh8ZK+ag9l244Vqxji3r6wgz9YBf6+vhQEYJZpSjqWFPg9gg=="

    <script type="module">
        import { get, post } from '../beauty/js/api-client.js';

        const urlParams = new URLSearchParams(window.location.search);
        const attemptId = urlParams.get('attemptId');
        if (!attemptId) {
            alert("Missing attemptId");
            throw new Error("Missing attemptId in URL");
        }

        let quizData = null;
        let currentIndex = 0;
        let userAnswers = {}; // { question_id: answerText }
        let flaggedQuestions = [];
        const reviewContainer = document.getElementById("review-container");
        const quizContainer = document.getElementById("quiz-container");
        const quizContent = document.getElementById("quiz-content");
        const titleEl = document.getElementById("quiz-title");
        const navEl = document.getElementById("quiz-nav");
        const sidebarEl = document.querySelector('.sub-menu');

        // Load quiz data
        async function loadQuiz() {
            try {
                const res = await get(`/test/details/attempt/${attemptId}`);
                quizData = res.test;
                titleEl.textContent = quizData.description;

                initializeTimer(res.attempt.startTime, quizData.timeLimit);
                renderSidebarNav();
                renderQuestion();
                renderNavigation();
            } catch (err) {
                console.error("Quiz Load Error:", err);
                alert("Failed to load quiz.");
            }
        }

        // Timer
        function initializeTimer(startTime, timeLimitInMinutes) {
            const end = new Date(startTime).getTime() + timeLimitInMinutes * 60 * 1000;
            const countdown = document.getElementById("countdown");

            const update = () => {
                const remaining = end - Date.now();
                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    alert("⏳ Time's up!");
                    submitQuiz();
                } else {
                    const hrs = String(Math.floor(remaining / 3600000)).padStart(2, "0");
                    const mins = String(Math.floor((remaining % 3600000) / 60000)).padStart(2, "0");
                    const secs = String(Math.floor((remaining % 60000) / 1000)).padStart(2, "0");
                    countdown.innerHTML = `<i class="ri-time-line"></i> Time Left - <span class="h5 text-white">${hrs}:${mins}:${secs}</span>`;
                }
            };
            const timerInterval = setInterval(update, 1000);
            update();
        }

        // Sidebar
        function renderSidebarNav() {
            sidebarEl.innerHTML = "";
            quizData.questions.forEach((_, idx) => {
                const isFlagged = flaggedQuestions.includes(idx);
                const li = document.createElement("li");
                li.innerHTML = `<a href="javascript:;" onclick="gotoQuestion(${idx})" class="${isFlagged ? 'text-red-500 font-bold' : ''}">
                  ${isFlagged ? '🚩 ' : ''}Question ${idx + 1}
                </a>`;
                sidebarEl.appendChild(li);
            });
        }

        // Main Question Renderer
        function renderQuestion() {
            const q = quizData.questions[currentIndex];
            quizContent.innerHTML = `
                <div class="border border-black/10 dark:border-white/10 rounded-md mb-6 scroll-mt-20">
                  <h2 class="text-sm p-4 bg-lightwhite dark:bg-white/5 font-semibold mb-2 block">
                    Question ${currentIndex + 1} of ${quizData.questions.length}
                  </h2>
                  <div class="p-5">
                    <p class="text-base mb-4">${q.question.replace(/\n/g, '<br>')}</p>
                    <div class="grid grid-cols-1 gap-3">
                      ${q.options.map(opt => `
                        <label class="inline-flex items-start space-x-2">
                          <input type="radio" name="question_${q.question_id}" value="${opt.label}" class="form-radio peer text-indigo-300"
                          ${userAnswers[q.question_id] === opt.label ? 'checked' : ''} />
                          <span class="peer-checked:text-indigo-500">${opt.label}. ${opt.text}</span>
                        </label>
                      `).join("")}
                    </div>
                    <div class="w-full text-right">
                      <button type="button" onclick="toggleFlag(${currentIndex})" class="flag-button bg-yellow-200 text-black p-2 rounded">
                        ${flaggedQuestions.includes(currentIndex) ? '🚩 Unflag' : '🚩 Flag for Review'}
                      </button>
                    </div>
                  </div>
                </div>
              `;
        }

        // Navigation Controls
        function renderNavigation() {
            navEl.innerHTML = `
                <button ${currentIndex === 0 ? "disabled" : ""} onclick="gotoQuestion(${currentIndex - 1})" class="btn">Previous</button>
                <button ${currentIndex === quizData.questions.length - 1 ? "disabled" : ""} onclick="gotoQuestion(${currentIndex + 1})" class="btn">Next</button>
              `;
        }

        // Capture answer
        quizContent.addEventListener("change", (e) => {
            const input = e.target;
            const q = quizData.questions[currentIndex];
            if (input.name.startsWith("question_")) {
                userAnswers[q.question_id] = input.value;
            }
        });

        // Toggle Flag
        window.toggleFlag = (index) => {
            if (flaggedQuestions.includes(index)) {
                flaggedQuestions = flaggedQuestions.filter(i => i !== index);
            } else {
                flaggedQuestions.push(index);
            }
            renderQuestion();
            renderSidebarNav();
        };

        // Move to specific question
        window.gotoQuestion = (index) => {
            currentIndex = index;
            renderQuestion();
            renderNavigation();


        };

        window.reviewQuiz = () => {
            const qHtml = quizData.questions.map((q, index) => {
                const answered = userAnswers[q.question_id] !== undefined;
                return `
        <tr class="${answered ? 'bg-green-50' : 'bg-red-50'}">
          <td class="px-3 py-2">${index + 1}</td>
          <td>${answered ? 'Answered' : 'Not Answered'}</td>
          <td>${flaggedQuestions.includes(index) ? '🚩' : ''}</td>
        </tr>
      `;
            }).join('');

            quizContainer.style.display = 'none';
            reviewContainer.style.display = 'block';
            reviewContainer.innerHTML = `
      <div class="bg-white dark:bg-black p-6 rounded">
        <h3 class="text-xl font-bold mb-4">Review Your Answers</h3>
        <table class="w-full border">
          <thead><tr><th>Q#</th><th>Status</th><th>Flag</th></tr></thead>
          <tbody>${qHtml}</tbody>
        </table>
        <div class="flex justify-between mt-4">
          <button onclick="hideReview()" class="btn btn-warning">Return to Attempt</button>
          <button onclick="submitFinalQuiz()" class="btn btn-success">Submit All and Finish</button>
        </div>
      </div>
    `;
        };

        window.hideReview = () => {
            quizContainer.style.display = 'block';
            reviewContainer.style.display = 'none';
        };

        window.submitFinalQuiz = async () => {
            const responses = Object.entries(userAnswers).map(([qid, response]) => ({ question_id: qid, response }));

            try {
                const result = await post('/test/submit', {
                    attempt_id: attemptId,
                    responses
                });
                alert("Quiz submitted successfully!");
                window.location.href = `./quiz-result.html?attemptId=${attemptId}`;
            } catch (error) {
                console.error("Submit Error:", error);
                alert("Failed to submit quiz.");
            }
        };

        // Submit Quiz
        window.submitQuiz = async () => {
            const responses = Object.entries(userAnswers).map(([question_id, label]) => {
                const q = quizData.questions.find(q => q.question_id === question_id);
                const opt = q.options.find(o => o.label === label);
                return { question_id, response: opt.text };
            });

            if (!responses.length) return alert("Please answer at least one question.");

            try {
                const result = await post('/test/submit', { attempt_id: attemptId, responses });
                alert("✅ Quiz submitted!");
                window.location.href = `./quiz-result.html?attemptId=${attemptId}`;
            } catch (err) {
                console.error(err);
                alert("❌ Submission failed.");
            }
        };

        loadQuiz();
    </script>


    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll("input[type='file']").forEach(input => {
                input.addEventListener("change", function (event) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function (e) {
                            const preview = document.getElementById("preview-" + event.target.id);
                            if (preview) {
                                preview.src = e.target.result;
                                preview.classList.remove("hidden");
                            }
                        };
                        reader.readAsDataURL(file);
                    }
                });
            });
        });
    </script>
