    <script type="module">
        import { get, post } from '../beauty/js/api-client.js';
        import BASE_URL from '../beauty/js/config.js';


        function getQuizIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get("contentId");
        }


        async function startTest(quizId) {
            console.log('Starting test with ID:', quizId);
            event.preventDefault();
            if (!quizId) {
                showToast('Quiz ID missing', 'danger');
                return;
            }


            try {
                const result = await post('/test/start', { test_id: quizId });

                if (result?.attempt?._id) {
                    showToast('Quiz started successfully!', 'success');
                    setTimeout(function () {
                        window.location.href = `./quiz-page.html?attemptId=${result.attempt._id}`;
                    }, 1000); // Give 1 sec delay for user to see the toast
                } else {
                    showToast(result.message || 'Failed to start quiz.', 'danger');
                }
            } catch (err) {
                console.log('Error starting quiz:', err);
                alert(err.message)
                showToast('An error occurred while starting the quiz.', 'danger');
                console.error('Start quiz failed:', err);
            }
        }

        async function loadQuizDetails() {
            console.log('Loading quiz details...');

            const contentId = getQuizIdFromUrl();
            if (!contentId) {
                showToast('Quiz ID missing in URL', 'danger');
                return;
            }
            console.log('Quiz ID:', contentId);


            try {
                const res = await get(`/test/details/content/${contentId}`);
                const quiz = res?.test;

                if (!quiz) {
                    showToast('Quiz not found', 'danger');
                    return;
                }
                document.getElementById('testname').textContent = quiz.description || 'Untitled Quiz';
                document.getElementById('quiz-title').textContent = quiz.description || 'Untitled Quiz';
                document.getElementById('quiz-description').textContent = quiz.description || 'No description available.';
                document.getElementById('quiz-stats').textContent = `${quiz.questions?.length || 0} Questions • ${quiz.timeLimit || 0} minutes`;
                document.getElementById('quiz-attempts').textContent = quiz.maxAttempts;
                // Set thumbnail if available
                const thumbnail = document.getElementById('quiz-thumbnail');
                if (thumbnail) {
                    thumbnail.src = quiz.image_url || 'https://placehold.co/600x400';
                }

                // Set start button link
                const startBtn = document.getElementById('start-quiz-btn');
                startBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    startTest(quiz.id);
                });

                // Show the start button
                startBtn.classList.remove('hidden');

            } catch (err) {
                console.error('Error loading quiz:', err);
                showToast('Failed to load quiz. Please try again.', 'danger');
            }
        }

        window.addEventListener('DOMContentLoaded', loadQuizDetails);
    </script>
